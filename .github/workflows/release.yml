name: release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          if [ -z "$VERSION" ]; then
            echo "::error::No se encontro el campo version en package.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        shell: bash
        run: |
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "::error::El tag ${TAG} ya existe. Incrementa la version en package.json antes de volver a ejecutar."
            exit 1
          fi
          echo "Tag ${TAG} disponible."

      - name: Build (tests + compile)
        run: bun run build

      - name: Stage binary as release asset
        shell: pwsh
        run: |
          $src = "out\weather.exe"
          if (-not (Test-Path -LiteralPath $src)) {
            Write-Error "::error::No se encontro el binario $src tras el build"
            exit 1
          }
          $asset = "weather-v${env:VERSION}-windows-x64.exe"
          Copy-Item -LiteralPath $src -Destination $asset -Force
          Write-Host "Asset generado: $asset"
          Write-Host "Tamano (bytes): $((Get-Item $asset).Length)"

      - name: Create and push tag
        shell: bash
        run: |
          TAG="v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: weather-v${{ env.VERSION }}-windows-x64.exe
          generate_release_notes: true